<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
	<!-- Prefer repository fonts -->
	<dir>/mnt/c/tesseract/work/fonts</dir>
	<!-- Also include common system font locations to ensure Latin fonts are discoverable -->
	<dir>/usr/share/fonts</dir>
	<dir>/usr/local/share/fonts</dir>
	<!-- Make Windows fonts available inside WSL for broader coverage -->
	<dir>/mnt/c/Windows/Fonts</dir>
	<config></config>
</fontconfig>
