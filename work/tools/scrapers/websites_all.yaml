# Web Scraper Configuration - ALL 12 WEBSITES
# YAML-based configuration for complete migration
# Generated: 2025-10-23

# ============================================================================
# KURDSAT TV (✅ TESTED - WORKING)
# ============================================================================
kurdsat:
  name: 'Kurdsat TV'
  base_url: 'https://kurdsat.tv'
  enabled: true
  
  language_detection:
    enabled: true
    filter: ['ckb', 'ar']
  
  selectors:
    article_list: 'a[href*="/ckb/news/"]'
    article_link: 'a'
    article_title: ['h1', 'h2.article-title', 'h2']
    article_content: '.article-body'
    article_paragraphs: ['div.article-body p', '.article-body p', '.content p', 'p']
  
  wait:
    type: 'manual'
    seconds: 3
  
  categories:
    news:
      enabled: true
      type: 'click_load_more'
      url: 'https://kurdsat.tv/ckb/news'
      clicks: 5
      load_more_button:
        type: 'xpath'
        value: '//button[contains(text(), "زیاتر ببینە")]'
    
    health:
      enabled: true
      type: 'pagination'
      url: 'https://kurdsat.tv/ckb/categories/8'
      pages: 3
    
    science:
      enabled: true
      type: 'pagination'
      url: 'https://kurdsat.tv/ckb/categories/16'
      pages: 3
    
    technology:
      enabled: true
      type: 'pagination'
      url: 'https://kurdsat.tv/ckb/categories/9'
      pages: 3
    
    opinion:
      enabled: true
      type: 'pagination'
      url: 'https://news.kurdsat.tv/ckb/opinions?page=1'
      pages: 3
      selectors:
        article_list: 'a[href*="/opinions/"]'
        article_title: ['h2.article-title', 'h1', 'h2']


# ============================================================================
# NRT - Nalia Radio & TV (✅ TESTED - WORKING)
# ============================================================================
nrt:
  name: 'NRT News'
  base_url: 'https://www.nrttv.com'
  enabled: true
  
  language_detection:
    enabled: true
    filter: ['ckb', 'ar']
  
  selectors:
    article_list: 'a[href*="detail/"]'
    article_link: 'a'
    article_title: ['h2.Name', 'h1', 'h2']
    article_description: 'p.de'
    article_content: 'div[style*="font-size:16px"]'
    article_paragraphs: ['div[style*="font-size:16px"] p', 'p']
  
  wait:
    type: 'manual'
    seconds: 3
  
  categories:
    kurdistan:
      enabled: true
      type: 'click_load_more'
      url: 'https://www.nrttv.com/Search.aspx?Keyword=&CatID=11'
      clicks: 5
      load_more_button:
        type: 'id'
        value: 'loadMore'
    
    world:
      enabled: true
      type: 'click_load_more'
      url: 'https://www.nrttv.com/Search.aspx?Keyword=&CatID=12'
      clicks: 5
      load_more_button:
        type: 'id'
        value: 'loadMore'


# ============================================================================
# RUDAW (Infinite Scroll)
# ============================================================================
rudaw:
  name: 'Rudaw News'
  base_url: 'https://www.rudaw.net'
  enabled: true
  
  language_detection:
    enabled: true
    filter: ['ckb', 'ar']
  
  selectors:
    article_list: 'a[href*="/sorani/"]'
    article_title: ['h1', 'h2', '.article-title']
    article_content: '.content'
    article_paragraphs: ['.content div', '.content p', 'p']
  
  wait:
    type: 'manual'
    seconds: 2
  
  categories:
    kurdistan:
      enabled: true
      type: 'infinite_scroll'
      url: 'https://www.rudaw.net/sorani/kurdistan'
      scrolls: 20
    
    culture:
      enabled: true
      type: 'infinite_scroll'
      url: 'https://www.rudaw.net/sorani/news?CategoryID=412631'
      scrolls: 20
    
    business:
      enabled: true
      type: 'infinite_scroll'
      url: 'https://www.rudaw.net/sorani/business'
      scrolls: 20


