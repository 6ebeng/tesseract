# NRT - Nalia Radio & TV Configuration
# Status: ⚠️  TESTING IN PROGRESS
# Last Updated: 2025-01-22

name: 'NRT News'
base_url: 'https://www.nrttv.com'
enabled: true
debug_urls: true  # Temporary: URL tracking for optimization

# ============================================================================
# URL FILTERING - Preset Based
# ============================================================================

url_filtering:
  preset: 'standard'
  whitelist:
    # Core content
    - 'nrttv.com/kurd'
    - 'nrttv.com/detail/'
    # Static resources
    - 'nrttv.com/js/'
    - 'nrttv.com/css/'
    - 'nrttv.com/wene/'
    - 'nrttv.com/WriterScript/'
    - 'nrttv.com/secondary-expandable-navigation/'
    - 'nrttv.com/js-slide-down-menu/'
    # Dynamic resources (ASP.NET)
    - 'nrttv.com/WebResource.axd'
    - 'nrttv.com/ScriptResource.axd'
    # CDNs
    - 'ajax.googleapis.com/'
    - 'maxcdn.bootstrapcdn.com/'
    # Search (Google CSE)
    - 'cse.google.com/cse.js'
  blacklist:
    # Analytics
    - 'www.google-analytics.com'
    - 'www.googletagmanager.com'
    # Tracking
    - 'certify-js.alexametrics.com'
    - 's7.addthis.com'

# ============================================================================
# ADVANCED FEATURES - All Enabled
# ============================================================================

# Rate Limiting: Prevent server overload and IP blocking
rate_limiting:
  enabled: true
  max_requests_per_minute: 30  # Polite scraping speed

# Redis Caching: Speed up re-runs by caching page HTML and articles
caching:
  enabled: true
  redis_host: 'localhost'
  redis_port: 6379
  ttl_hours: 24  # Cache for 24 hours

# Retry Logic: Handle network errors and timeouts
retry:
  enabled: true
  max_attempts: 3
  delay_seconds: 2

# Proxy Rotation: Bypass IP blocking (requires proxies.txt)
proxy:
  enabled: false  # Set to true when proxies.txt is available
  file: 'proxies.txt'
  strategy: 'round-robin'  # or 'random'


# Universal pagination - Load More button
pagination:
  type: 'click_load_more'
  load_more_button: '#loadMore'
  clicks: 10
  delay: 2

# Selectors support multiple formats:
# - String: 'h1' or '//h1' (CSS or XPath auto-detected by // prefix)
# - Array: ['h1', '//h2', 'div.title'] (tries each until one works, can mix CSS/XPath)
# - Dict with single selector: {selector: '//div', multiple: true, delimiter: '\n'}
# - Dict with array selector: {selector: ['//div', 'p'], multiple: true, delimiter: '\n'}
selectors:
  article_list: '#myList > li[style="display: list-item;"]> div > table > tbody > tr:nth-child(2) > td > a'
  article_title: ['div.detail > h2']
  article_body:
    selector: "//div[@class='detail']/div[not(contains(@style,'http') or (@class='detail-div') or (@class='clearfix') or (@class='clear'))]"
    multiple: true
    delimiter: '\n'

wait:
  selector: null
  timeout: 3

categories:
  news:
    url: 'https://nrttv.com/kurd'
    pagination:
      clicks: 15
  
  economy:
    url: 'https://nrttv.com/abury'
    pagination:
      clicks: 5
  
  social:
    url: 'https://nrttv.com/komalayaty'
    pagination:
      clicks: 5
  
  culture:
    url: 'https://nrttv.com/kltwr'
    pagination:
      clicks: 5
  
  science:
    url: 'https://nrttv.com/zanst'
    pagination:
      clicks: 5
  
  technology:
    url: 'https://nrttv.com/teknology'
    pagination:
      clicks: 5
