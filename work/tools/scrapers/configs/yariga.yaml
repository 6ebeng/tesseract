# Yariga - Kurdish News Website
# Status: ✅ NEW WEBSITE
# Last Updated: 2025-10-25

name: 'Yariga'
base_url: 'https://yariga.net'
enabled: true
debug_urls: true  # Temporary: URL tracking for optimization

# ============================================================================
# URL FILTERING - Preset Based
# ============================================================================

url_filtering:
  preset: 'standard'
  whitelist: []
  blacklist: []

# ============================================================================
# ADVANCED FEATURES - All Enabled
# ============================================================================

# Rate Limiting: Prevent server overload and IP blocking
rate_limiting:
  enabled: true
  max_requests_per_minute: 30  # Polite scraping speed

# Redis Caching: Speed up re-runs by caching page HTML and articles
caching:
  enabled: true
  redis_host: 'localhost'
  redis_port: 6379
  ttl_hours: 24  # Cache for 24 hours

# Retry Logic: Handle network errors and timeouts
retry:
  enabled: true
  max_attempts: 3
  delay_seconds: 2

# Proxy Rotation: Bypass IP blocking (requires proxies.txt)
proxy:
  enabled: false  # Set to true when proxies.txt is available
  file: 'proxies.txt'
  strategy: 'round-robin'  # or 'random'


# Universal pagination settings
pagination:
  type: 'click_load_more'
  clicks: 10
  delay: 2
  load_more_button: 'a.load-more-button'

selectors:
  # Article links on collection/list page
  article_list: ['div#tie-block_1333 ul.posts-items li h2.post-title > a', 'h2.post-title > a', 'article a[href*="/sport/"]']
  
  # Article title on article page (try both h1 and h2)
  article_title:
    selector: ['div.entry-header > h1', 'div.entry-header > h2']
    multiple: true
    delimiter: '\n'
  
  # Article body content
  article_body:
    selector: ["div.entry-content > div[class*='my']", "div.entry-content p"]
    multiple: true
    delimiter: '\n'

# Default wait (fallback for both collection and article pages)
wait:
  selector: null
  timeout: 3

# Wait for collection/list page to load
collection_wait:
  selector: 'ul.posts-items'
  timeout: 5

# Wait for article page to load
article_wait:
  selector: 'div.entry-content'
  timeout: 3

categories:
  sport:
    url: 'https://yariga.net/'
