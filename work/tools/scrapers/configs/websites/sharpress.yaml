name: Sharpress
base_url: https://www.sharpress.net
enabled: true
debug_urls: true
url_filtering:
  preset: standard
  whitelist:
  - '*.sharpress.net/*'
  - '*.sharpress.net/wp-content/*'
  - '*.sharpress.net/wene/*'
  - '*.gstatic.com/*.woff2'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
rate_limiting:
  enabled: true
  max_requests_per_minute: 30
caching:
  enabled: true
  redis_host: localhost
  redis_port: 6379
  ttl_hours: 24
retry:
  enabled: true
  max_attempts: 3
  delay_seconds: 2
proxy:
  enabled: false
  file: proxies.txt
  strategy: round-robin
pagination:
  type: click_load_more
  clicks: 5
  delay: 2
  load_more_button: a.numericbutton
selectors:
  article_list: div.more-news-page ul li a, div.birura-page ul li a
  article_title:
  - h1.detail-title
  article_body:
  - 'div.detail-big div.detail-content > p[style="text-align: justify;"]'
wait:
  selector: null
  timeout: 2
categories:
  kurdistan:
    url: https://www.sharpress.net/all-hawal.aspx?Cor=Herem&Nawnishan=%DA%A9%D9%88%D8%B1%D8%AF%D8%B3%D8%AA%D8%A7%D9%86
  culture:
    url: https://www.sharpress.net/all-hawal.aspx?Cor=K%C3%BClt%C3%BCr&Nawnishan=%DA%A9%D9%88%D9%84%D8%AA%D9%88%D9%88%D8%B1
request_filter:
  whitelist:
  - '*.sharpress.net/*'
  - '*.sharpress.net/wp-content/*'
  - '*.sharpress.net/wene/*'
  - '*.gstatic.com/*.woff2'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
