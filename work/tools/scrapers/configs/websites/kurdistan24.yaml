# Kurdistan24 Configuration
# Status: ⚠️ REQUIRES FLARESOLVERR - Cloudflare protection
# Last Updated: 2025-10-24
# NOTE: This site requires FlareSolverr running on http://localhost:8191
#       To start FlareSolverr: docker run -d -p 8191:8191 ghcr.io/flaresolverr/flaresolverr:latest

name: 'Kurdistan 24'
base_url: 'https://www.kurdistan24.net'
enabled: true  # FlareSolverr is running

# Enable debug logging only when refining filters
debug_urls: true  # Temporary: URL tracking for optimization

# URL filtering tuned from captured network requests
url_filtering:
  preset: 'standard'
  whitelist:
    - 'https://www.kurdistan24.net/ckb/list/category/*'
    - 'https://www.kurdistan24.net/ckb/story/*'
  blacklist: []

# ============================================================================
# ADVANCED FEATURES - All Enabled
# ============================================================================

# Rate Limiting: Prevent server overload and IP blocking
rate_limiting:
  enabled: true
  max_requests_per_minute: 30  # Polite scraping speed

# Redis Caching: Speed up re-runs by caching page HTML and articles
caching:
  enabled: true
  redis_host: 'localhost'
  redis_port: 6379
  ttl_hours: 24  # Cache for 24 hours

# Retry Logic: Handle network errors and timeouts
retry:
  enabled: true
  max_attempts: 3
  delay_seconds: 2

# Proxy Rotation: Bypass IP blocking (requires proxies.txt)
proxy:
  enabled: false  # Set to true when proxies.txt is available
  file: 'proxies.txt'
  strategy: 'round-robin'  # or 'random'

# FlareSolverr Configuration (Cloudflare bypass)
flaresolverr:
  enabled: true
  url: 'http://localhost:8191'
  max_timeout: 60000  # milliseconds
  session_ttl: 600  # seconds


# Universal pagination
pagination:
  type: 'url_template'  # Query parameter pagination
  pages: 3
  delay: 2
  page_param: 'page'  # Append ?page=N

selectors:
  article_list: 'article a[href*="/story/"]'
  article_title: 'article h1[itemprop="Title"]'
  article_body:
    selector: 'div.reader-content > p'
    multiple: true
    delimiter: '\n'

wait:
  selector: null
  timeout: 3

categories:
  politics:
    url: 'https://www.kurdistan24.net/ckb/list/category/9'
  
  economy:
    url: 'https://www.kurdistan24.net/ckb/list/category/12'
  
  culture:
    url: 'https://www.kurdistan24.net/ckb/list/category/10'
  
  health:
    url: 'https://www.kurdistan24.net/ckb/category/4'
    pagination:
      pages: 2
  opinion:
    url: 'https://www.kurdistan24.net/ckb/list/category/14'
    selectors:
      article_list: 'article > div > a:nth-child(2)'
