name: Kurdistan 24
base_url: https://www.kurdistan24.net
enabled: true
debug_urls: true
url_filtering:
  preset: standard
  whitelist:
  - '*.kurdistan24.net/*'
  - '*.gstatic.com/*.woff2'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
rate_limiting:
  enabled: true
  max_requests_per_minute: 30
caching:
  enabled: true
  redis_host: localhost
  redis_port: 6379
  ttl_hours: 24
retry:
  enabled: true
  max_attempts: 3
  delay_seconds: 2
proxy:
  enabled: false
  file: proxies.txt
  strategy: round-robin
flaresolverr:
  enabled: true
  url: http://localhost:8191
  max_timeout: 60000
  session_ttl: 600
pagination:
  type: url_template
  pages: 3
  delay: 2
  page_param: page
selectors:
  article_list: article a[href*="/story/"]
  article_title: article h1[itemprop="Title"]
  article_body:
    selector: div.reader-content > p
    multiple: true
    delimiter: \n
wait:
  selector: null
  timeout: 3
categories:
  politics:
    url: https://www.kurdistan24.net/ckb/list/category/9
  economy:
    url: https://www.kurdistan24.net/ckb/list/category/12
  culture:
    url: https://www.kurdistan24.net/ckb/list/category/10
  health:
    url: https://www.kurdistan24.net/ckb/category/4
    pagination:
      pages: 2
  opinion:
    url: https://www.kurdistan24.net/ckb/list/category/14
    selectors:
      article_list: article > div > a:nth-child(2)
request_filter:
  whitelist:
  - '*.kurdistan24.net/*'
  - '*.gstatic.com/*.woff2'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
