# Balinde Configuration
# Status: ⚠️ NEEDS SELECTOR FIX
# Last Updated: 2025-10-24

name: 'Balinde'
base_url: 'https://balinde.com'
enabled: true
debug_urls: true  # Temporary: URL tracking for optimization

# ============================================================================
# URL FILTERING - Preset Based
# ============================================================================

url_filtering:
  preset: 'standard'
  whitelist: []
  blacklist: []

# ============================================================================
# ADVANCED FEATURES - All Enabled
# ============================================================================

# Rate Limiting: Prevent server overload and IP blocking
rate_limiting:
  enabled: true
  max_requests_per_minute: 30  # Polite scraping speed

# Redis Caching: Speed up re-runs by caching page HTML and articles
caching:
  enabled: true
  redis_host: 'localhost'
  redis_port: 6379
  ttl_hours: 24  # Cache for 24 hours

# Retry Logic: Handle network errors and timeouts
retry:
  enabled: true
  max_attempts: 3
  delay_seconds: 2

# Proxy Rotation: Bypass IP blocking (requires proxies.txt)
proxy:
  enabled: false  # Set to true when proxies.txt is available
  file: 'proxies.txt'
  strategy: 'round-robin'  # or 'random'


# Universal pagination
pagination:
  type: 'url_template'  # Path-based pagination
  pages: 3
  delay: 2
  page_param: null  # Using path-based URL template instead

selectors:
  article_list: 'div.cards a.card'
  article_title: ['h1', 'h2', '.title']
  article_body: ['div.poet-timeline p', 'div.poet-timeline', '.entry-content p', 'p']  # Poetry content

wait:
  selector: null
  timeout: 2

categories:
  kurdish_poetry:
    url: 'https://balinde.com/category/kurdishpoem/page/{page}/'
  
  articles:
    url: 'https://balinde.com/category/wtar/page/{page}/'
