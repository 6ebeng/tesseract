name: Balinde
base_url: https://balinde.com
enabled: true
debug_urls: true
url_filtering:
  preset: standard
  whitelist:
  - '*.balinde.com/*'
  - '*.balinde.com/wp-content/*'
  - '*.gstatic.com/*.woff2'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
rate_limiting:
  enabled: true
  max_requests_per_minute: 30
caching:
  enabled: true
  redis_host: localhost
  redis_port: 6379
  ttl_hours: 24
retry:
  enabled: true
  max_attempts: 3
  delay_seconds: 2
proxy:
  enabled: false
  file: proxies.txt
  strategy: round-robin
pagination:
  type: url_template
  pages: 3
  delay: 2
  page_param: null
selectors:
  article_list: div.cards a.card
  article_title:
  - h1
  - h2
  - .title
  article_body:
  - div.poet-timeline p
  - div.poet-timeline
  - .entry-content p
  - p
wait:
  selector: null
  timeout: 2
categories:
  kurdish_poetry:
    url: https://balinde.com/category/kurdishpoem/page/{page}/
  articles:
    url: https://balinde.com/category/wtar/page/{page}/
request_filter:
  whitelist:
  - '*.balinde.com/*'
  - '*.balinde.com/wp-content/*'
  - '*.gstatic.com/*.woff2'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
