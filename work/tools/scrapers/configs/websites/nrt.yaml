name: NRT News
base_url: https://www.nrttv.com
enabled: true
debug_urls: true
url_filtering:
  preset: standard
  whitelist:
  - '*.nrttv.com/*'
  - '*.nrttv.com/wp-content/*'
  - '*.nrttv.com/ckb/*'
  - '*.gstatic.com/*.woff2'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
rate_limiting:
  enabled: true
  max_requests_per_minute: 30
caching:
  enabled: true
  redis_host: localhost
  redis_port: 6379
  ttl_hours: 24
retry:
  enabled: true
  max_attempts: 3
  delay_seconds: 2
proxy:
  enabled: false
  file: proxies.txt
  strategy: round-robin
pagination:
  type: click_load_more
  load_more_button: '#loadMore'
  clicks: 10
  delay: 2
selectors:
  article_list: '#myList > li[style="display: list-item;"]> div > table > tbody >
    tr:nth-child(2) > td > a'
  article_title:
  - div.detail > h2
  article_body:
    selector: //div[@class='detail']/div[not(contains(@style,'http') or (@class='detail-div')
      or (@class='clearfix') or (@class='clear'))]
    multiple: true
    delimiter: \n
wait:
  selector: null
  timeout: 3
categories:
  news:
    url: https://nrttv.com/kurd
    pagination:
      clicks: 15
  economy:
    url: https://nrttv.com/abury
    pagination:
      clicks: 5
  social:
    url: https://nrttv.com/komalayaty
    pagination:
      clicks: 5
  culture:
    url: https://nrttv.com/kltwr
    pagination:
      clicks: 5
  science:
    url: https://nrttv.com/zanst
    pagination:
      clicks: 5
  technology:
    url: https://nrttv.com/teknology
    pagination:
      clicks: 5
request_filter:
  whitelist:
  - '*.nrttv.com/*'
  - '*.nrttv.com/wp-content/*'
  - '*.nrttv.com/ckb/*'
  - '*.gstatic.com/*.woff2'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
