name: Xendan
base_url: https://www.xendan.org
enabled: true
debug_urls: true
url_filtering:
  preset: standard
  whitelist:
  - '*.xendan.org/*'
  - '*.xendan.org/wp-content/*'
  - '*.xendan.org/wene/*'
  - '*.gstatic.com/*.woff2'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
rate_limiting:
  enabled: true
  max_requests_per_minute: 30
caching:
  enabled: true
  redis_host: localhost
  redis_port: 6379
  ttl_hours: 24
retry:
  enabled: true
  max_attempts: 3
  delay_seconds: 2
proxy:
  enabled: false
  file: proxies.txt
  strategy: round-robin
pagination:
  type: click_load_more
  clicks: 5
  delay: 2
  load_more_button: a.nextbutton
selectors:
  article_list: a:has(> .card-small)
  article_title:
  - div.detail-top > h1
  article_body:
  - div.detail-big-text-p > p
wait:
  selector: null
  timeout: 2
categories:
  political:
    url: https://www.xendan.org/babetakan?babet=1&title=%DA%A9%D9%88%D8%B1%D8%AF%D8%B3%D8%AA%D8%A7%D9%86
  culture:
    url: https://www.xendan.org/babetakan?babet=8
    pagination:
      clicks: 3
  sports:
    url: https://www.xendan.org/babetakan?babet=7
    pagination:
      clicks: 3
request_filter:
  whitelist:
  - '*.xendan.org/*'
  - '*.xendan.org/wp-content/*'
  - '*.xendan.org/wene/*'
  - '*.gstatic.com/*.woff2'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
