name: AvaNews
base_url: https://www.ava.news
enabled: true
debug_urls: true
url_filtering:
  preset: standard
  whitelist:
  - '*.ava.news/*'
  - '*.gstatic.com/*.woff2'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
rate_limiting:
  enabled: true
  max_requests_per_minute: 30
caching:
  enabled: true
  redis_host: localhost
  redis_port: 6379
  ttl_hours: 24
retry:
  enabled: true
  max_attempts: 3
  delay_seconds: 2
proxy:
  enabled: false
  file: proxies.txt
  strategy: round-robin
pagination:
  type: url_template
  pages: 10
  delay: 2
  page_param: page
selectors:
  article_list: ul > li > div > div > a
  article_title:
  - div.intro > h1
  article_body:
  - div.news-content
wait:
  selector: null
  timeout: 3
categories:
  news:
    url: https://www.ava.news/kurdistan
  economy:
    url: https://www.ava.news/business
  culture:
    url: https://www.ava.news/culture
  environment:
    url: https://www.ava.news/environment
  health:
    url: https://www.ava.news/health
  opinion:
    url: https://www.ava.news/opinion
    selectors:
      article_list: h2 > a
request_filter:
  whitelist:
  - '*.ava.news/*'
  - '*.gstatic.com/*.woff2'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
