name: Kurdsat TV
base_url: https://kurdsat.tv
enabled: true
debug_urls: true
url_filtering:
  preset: standard
  whitelist:
  - '*.kurdsat.tv/*'
  - '*.kurdsat.tv/_next/*'
  - '*.kurdsat.tv/ckb/*'
  - news.kurdsat.tv/*
  - '*.gstatic.com/*.woff2'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
rate_limiting:
  enabled: true
  max_requests_per_minute: 30
caching:
  enabled: true
  redis_host: localhost
  redis_port: 6379
  ttl_hours: 24
retry:
  enabled: true
  max_attempts: 3
  delay_seconds: 2
proxy:
  enabled: false
  file: proxies.txt
  strategy: round-robin
pagination:
  type: pagination
  pages: 3
  delay: 2
selectors:
  article_list: a[href*="/articles/"]
  article_title:
  - h1
  - h2.article-title
  - h2
  article_body:
  - div.article-body p
  - .article-body p
  - .content p
  - p
wait:
  selector: null
  timeout: 3
categories:
  news:
    url: https://kurdsat.tv/ckb/news
    pagination:
      type: click_load_more
      clicks: 5
      load_more_button: //button[contains(text(), "زیاتر ببینە")]
    selectors:
      article_list: a[href*="/ckb/news/"]
  health:
    url: https://kurdsat.tv/ckb/categories/8
  science:
    url: https://kurdsat.tv/ckb/categories/16
  technology:
    url: https://kurdsat.tv/ckb/categories/9
  opinion:
    url: https://news.kurdsat.tv/ckb/opinions
    pagination:
      pages: 5
    selectors:
      article_list: a[href*="/opinions/"]
      article_title:
      - h2.article-title
      - h1
      - h2
request_filter:
  whitelist:
  - '*.kurdsat.tv/*'
  - '*.kurdsat.tv/_next/*'
  - '*.kurdsat.tv/ckb/*'
  - news.kurdsat.tv/*
  - '*.gstatic.com/*.woff2'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
