name: Sekokurd
base_url: https://sekokurd.org
enabled: true
debug_urls: true
url_filtering:
  preset: standard
  whitelist:
  - '*.sekokurd.org/*'
  - '*.sekokurd.org/wp-content/*'
  - '*.gstatic.com/*.woff2'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
rate_limiting:
  enabled: true
  max_requests_per_minute: 30
caching:
  enabled: true
  redis_host: localhost
  redis_port: 6379
  ttl_hours: 24
retry:
  enabled: true
  max_attempts: 3
  delay_seconds: 2
proxy:
  enabled: false
  file: proxies.txt
  strategy: round-robin
pagination:
  type: click_load_more
  clicks: 10
  delay: 2
  load_more_button: .anwp-pg-load-more__btn
selectors:
  article_list: div.anwp-pg-post-teaser > div > a.anwp-link-without-effects
  article_title:
  - .wpr-post-title
  article_body:
  - .wpr-post-content p
wait:
  selector: null
  timeout: 2
categories:
  literature:
    url: https://sekokurd.org/?page_id=874
  analysis:
    url: https://sekokurd.org/?page_id=1614
request_filter:
  whitelist:
  - '*.sekokurd.org/*'
  - '*.sekokurd.org/wp-content/*'
  - '*.gstatic.com/*.woff2'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
