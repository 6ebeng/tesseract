# Sekokurd (Literary/Cultural) Configuration
# Status: ✅ TESTED - WORKING
# Last Updated: 2025-10-24

name: 'Sekokurd'
base_url: 'https://sekokurd.org'
enabled: true
debug_urls: true  # Temporary: URL tracking for optimization

# ============================================================================
# URL FILTERING - Preset Based
# ============================================================================

url_filtering:
  preset: 'standard'
  whitelist: []
  blacklist: []

# ============================================================================
# ADVANCED FEATURES - All Enabled
# ============================================================================

# Rate Limiting: Prevent server overload and IP blocking
rate_limiting:
  enabled: true
  max_requests_per_minute: 30  # Polite scraping speed

# Redis Caching: Speed up re-runs by caching page HTML and articles
caching:
  enabled: true
  redis_host: 'localhost'
  redis_port: 6379
  ttl_hours: 24  # Cache for 24 hours

# Retry Logic: Handle network errors and timeouts
retry:
  enabled: true
  max_attempts: 3
  delay_seconds: 2

# Proxy Rotation: Bypass IP blocking (requires proxies.txt)
proxy:
  enabled: false  # Set to true when proxies.txt is available
  file: 'proxies.txt'
  strategy: 'round-robin'  # or 'random'


# Universal pagination
pagination:
  type: 'click_load_more'
  clicks: 10
  delay: 2
  load_more_button: '.anwp-pg-load-more__btn'

selectors:
  article_list: 'div.anwp-pg-post-teaser > div > a.anwp-link-without-effects'
  article_title: ['.wpr-post-title']
  article_body: ['.wpr-post-content p']  # Merged

wait:
  selector: null
  timeout: 2

categories:
  literature:
    url: 'https://sekokurd.org/?page_id=874'
  
  analysis:
    url: 'https://sekokurd.org/?page_id=1614'
