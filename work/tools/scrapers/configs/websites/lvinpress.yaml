# Lvinpress Configuration
# Status: ✅ CONFIGURED (based on legacy scraper)
# Last Updated: 2025-10-24

name: 'Lvinpress'
base_url: 'https://lvinpress.com'
enabled: true
debug_urls: true  # Temporary: URL tracking for optimization

# ============================================================================
# URL FILTERING - Preset Based
# ============================================================================

url_filtering:
  preset: 'standard'
  whitelist: []
  blacklist: []

# ============================================================================
# ADVANCED FEATURES - All Enabled
# ============================================================================

# Rate Limiting: Prevent server overload and IP blocking
rate_limiting:
  enabled: true
  max_requests_per_minute: 30  # Polite scraping speed

# Redis Caching: Speed up re-runs by caching page HTML and articles
caching:
  enabled: true
  redis_host: 'localhost'
  redis_port: 6379
  ttl_hours: 24  # Cache for 24 hours

# Retry Logic: Handle network errors and timeouts
retry:
  enabled: true
  max_attempts: 3
  delay_seconds: 2

# Proxy Rotation: Bypass IP blocking (requires proxies.txt)
proxy:
  enabled: false  # Set to true when proxies.txt is available
  file: 'proxies.txt'
  strategy: 'round-robin'  # or 'random'


# Path-based pagination: /page/2, /page/3, etc.
# Note: page 1 uses base URL (no /page/1 suffix)
pagination:
  type: 'url_template'
  path: '/page/{page}'  # Path pattern appended for pages 2+
  pages: 3
  delay: 3

selectors:
  article_list: 'article.elementor-post > div > a'  # Updated selector
  article_title: ['h1', 'h2', '.entry-title']  # Simplified - just find any h1/h2
  article_body: ['.ast-article-single p', '.entry-content p', 'article p']  # Multiple fallbacks

wait:
  timeout: 10  # Give enough time for Elementor to load

collection_wait:
  selector: 'article.elementor-post'
  timeout: 5

article_wait:
  selector: '.entry-content'
  timeout: 5

categories:
  kurdistan_news:
    url: 'https://lvinpress.com/category/news/kurdistan'
    pagination:
      pages: 5
  
  social_media:
    url: 'https://lvinpress.com/category/socialmedia'
  
  opinion:
    url: 'https://lvinpress.com/category/birura'
