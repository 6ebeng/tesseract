name: Lvinpress
base_url: https://lvinpress.com
enabled: true
debug_urls: true
url_filtering:
  preset: standard
  whitelist:
  - '*.lvinpress.com/*'
  - '*.lvinpress.com/wp-content/*'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
rate_limiting:
  enabled: true
  max_requests_per_minute: 30
caching:
  enabled: true
  redis_host: localhost
  redis_port: 6379
  ttl_hours: 24
retry:
  enabled: true
  max_attempts: 3
  delay_seconds: 2
proxy:
  enabled: false
  file: proxies.txt
  strategy: round-robin
pagination:
  type: url_template
  path: /page/{page}
  pages: 3
  delay: 3
selectors:
  article_list: article.elementor-post > div > a
  article_title:
  - h1
  - h2
  - .entry-title
  article_body:
  - .ast-article-single p
  - .entry-content p
  - article p
wait:
  timeout: 10
collection_wait:
  selector: article.elementor-post
  timeout: 5
article_wait:
  selector: .entry-content
  timeout: 5
categories:
  kurdistan_news:
    url: https://lvinpress.com/category/news/kurdistan
    pagination:
      pages: 5
  social_media:
    url: https://lvinpress.com/category/socialmedia
  opinion:
    url: https://lvinpress.com/category/birura
request_filter:
  whitelist:
  - '*.lvinpress.com/*'
  - '*.lvinpress.com/wp-content/*'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
