name: Rudaw News
base_url: https://www.rudaw.net
enabled: true
debug_urls: true
url_filtering:
  preset: standard
  whitelist:
  - '*.rudaw.net/*'
  - '*.gstatic.com/*.woff2'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
rate_limiting:
  enabled: true
  max_requests_per_minute: 30
caching:
  enabled: true
  redis_host: localhost
  redis_port: 6379
  ttl_hours: 24
retry:
  enabled: true
  max_attempts: 3
  delay_seconds: 2
proxy:
  enabled: false
  file: proxies.txt
  strategy: round-robin
pagination:
  type: infinite_scroll
  scrolls: 20
  delay: 2
selectors:
  article_list: h3.article__title > a
  article_title: h1.article-main__title
  article_body:
    selector: '//div[contains(@class,''bodyContentMainParent'')]/div[@style=''text-align:
      justify;'']'
    multiple: true
    delimiter: \n
wait:
  selector: null
  timeout: 2
categories:
  kurdistan:
    url: https://www.rudaw.net/sorani/kurdistan
  culture:
    url: https://www.rudaw.net/sorani/news?CategoryID=412631
    pagination:
      scrolls: 15
  business:
    url: https://www.rudaw.net/sorani/business
request_filter:
  whitelist:
  - '*.rudaw.net/*'
  - '*.gstatic.com/*.woff2'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
