# Awene Newspaper Configuration
# Status: ⚠️ NEEDS SELECTOR FIX
# Last Updated: 2025-10-24

name: 'Awene'
base_url: 'https://www.awene.com'
enabled: true
debug_urls: true  # Temporary: URL tracking for optimization

# ============================================================================
# URL FILTERING - Preset Based
# ============================================================================

url_filtering:
  preset: 'standard'
  whitelist:
    # Core content
    - 'www.awene.com/part?section='
    - 'www.awene.com/detail?article='
    - 'www.awene.com/culture'
    - 'www.awene.com/aburi'
    # Static resources
    - 'www.awene.com/menu/'
    - 'www.awene.com/bootstrapjs/'
    - 'www.awene.com/main.css'
    - 'www.awene.com/mobile.css'
    - 'www.awene.com/fav/'
    # WebResource (ASP.NET dynamic resources)
    - 'www.awene.com/WebResource.axd'
    # CDNs
    - 'cdnjs.cloudflare.com/'
    - 'fonts.googleapis.com/'
    - 'fonts.gstatic.com/'
    - 'use.fontawesome.com/'
    # Social embeds (comments)
    - 'facebook.com/plugins/comments.php'
    - 'facebook.com/plugins/feedback.php'
    - 'platform.twitter.com/widgets/'
  blacklist:
    # Analytics
    - 'www.google-analytics.com'
    - 'www.googletagmanager.com'
    # Social tracking
    - 'platform-api.sharethis.com'
    - 'buttons-config.sharethis.com'
    - 'l.sharethis.com/pview'
    - 'connect.facebook.net'

# ============================================================================
# ADVANCED FEATURES - All Enabled
# ============================================================================

# Rate Limiting: Prevent server overload and IP blocking
rate_limiting:
  enabled: true
  max_requests_per_minute: 30  # Polite scraping speed

# Redis Caching: Speed up re-runs by caching page HTML and articles
caching:
  enabled: true
  redis_host: 'localhost'
  redis_port: 6379
  ttl_hours: 24  # Cache for 24 hours

# Retry Logic: Handle network errors and timeouts
retry:
  enabled: true
  max_attempts: 3
  delay_seconds: 2

# Proxy Rotation: Bypass IP blocking (requires proxies.txt)
proxy:
  enabled: false  # Set to true when proxies.txt is available
  file: 'proxies.txt'
  strategy: 'round-robin'  # or 'random'


# Universal pagination
pagination:
  type: 'url_template'  # URLs use page parameter
  pages: 5
  delay: 2
  page_param: 'page'  # Append ?page=N or &page=N

selectors:
  article_list: '.newstopsumbtitle a'
  article_title: ['h1', 'h2', '.title']
  article_body: ['.viewdesc p', 'p']  # Merged

wait:
  selector: null
  timeout: 2

categories:
  politics:
    url: 'https://www.awene.com/part?section=2'
  
  culture:
    url: 'https://www.awene.com/culture'
    pagination:
      pages: 3
  
  economy:
    url: 'https://www.awene.com/aburi'
    pagination:
      pages: 3
