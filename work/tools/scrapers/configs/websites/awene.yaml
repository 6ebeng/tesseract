name: Awene
base_url: https://www.awene.com
enabled: true
debug_urls: true
url_filtering:
  preset: standard
  whitelist:
  - '*.awene.com/*'
  - '*.awene.com/wp-content/*'
  - '*.gstatic.com/*.woff2'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
rate_limiting:
  enabled: true
  max_requests_per_minute: 30
caching:
  enabled: true
  redis_host: localhost
  redis_port: 6379
  ttl_hours: 24
retry:
  enabled: true
  max_attempts: 3
  delay_seconds: 2
proxy:
  enabled: false
  file: proxies.txt
  strategy: round-robin
pagination:
  type: url_template
  pages: 5
  delay: 2
  page_param: page
selectors:
  article_list: .newstopsumbtitle a
  article_title:
  - h1
  - h2
  - .title
  article_body:
  - .viewdesc p
  - p
wait:
  selector: null
  timeout: 2
categories:
  politics:
    url: https://www.awene.com/part?section=2
  culture:
    url: https://www.awene.com/culture
    pagination:
      pages: 3
  economy:
    url: https://www.awene.com/aburi
    pagination:
      pages: 3
request_filter:
  whitelist:
  - '*.awene.com/*'
  - '*.awene.com/wp-content/*'
  - '*.gstatic.com/*.woff2'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
