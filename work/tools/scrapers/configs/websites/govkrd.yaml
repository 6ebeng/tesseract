name: Kurdistan Regional Government
base_url: https://gov.krd
enabled: true
debug_urls: true
url_filtering:
  preset: standard
  whitelist:
  - '*.gov.krd/*'
  - '*.gov.krd/ka/*'
  - '*.bootstrapcdn.com/*.css'
  - '*.cloudflare.com/*.js'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
rate_limiting:
  enabled: true
  max_requests_per_minute: 30
caching:
  enabled: true
  redis_host: localhost
  redis_port: 6379
  ttl_hours: 24
retry:
  enabled: true
  max_attempts: 3
  delay_seconds: 2
proxy:
  enabled: false
  file: proxies.txt
  strategy: round-robin
pagination:
  type: url_template
  pages: 5
  delay: 2
  page_param: page
selectors:
  article_list: div.item a[href*="/ka/activities/"]
  article_title:
  - h1.heading.main
  - h1
  - h2
  article_body:
  - div > p[dir="rtl"]
  - div.right-col p
  - p
wait:
  selector: null
  timeout: 2
article_wait:
  selector: .entry-content, article, main
  timeout: 5
categories:
  activities:
    url: https://gov.krd/ka/activities/
request_filter:
  whitelist:
  - '*.gov.krd/*'
  - '*.gov.krd/ka/*'
  - '*.bootstrapcdn.com/*.css'
  - '*.cloudflare.com/*.js'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
