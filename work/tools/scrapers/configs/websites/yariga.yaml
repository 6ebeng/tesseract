name: Yariga
base_url: https://yariga.net
enabled: true
debug_urls: true
url_filtering:
  preset: standard
  whitelist:
  - '*.yariga.net/*'
  - '*.yariga.net/wp-content/*'
  - '*.gstatic.com/*.woff2'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
rate_limiting:
  enabled: true
  max_requests_per_minute: 30
caching:
  enabled: true
  redis_host: localhost
  redis_port: 6379
  ttl_hours: 24
retry:
  enabled: true
  max_attempts: 3
  delay_seconds: 2
proxy:
  enabled: false
  file: proxies.txt
  strategy: round-robin
pagination:
  type: click_load_more
  clicks: 10
  delay: 2
  load_more_button: a.load-more-button
selectors:
  article_list:
  - div#tie-block_1333 ul.posts-items li h2.post-title > a
  - h2.post-title > a
  - article a[href*="/sport/"]
  article_title:
    selector:
    - div.entry-header > h1
    - div.entry-header > h2
    multiple: true
    delimiter: \n
  article_body:
    selector:
    - div.entry-content > div[class*='my']
    - div.entry-content p
    multiple: true
    delimiter: \n
wait:
  selector: null
  timeout: 3
collection_wait:
  selector: ul.posts-items
  timeout: 5
article_wait:
  selector: div.entry-content
  timeout: 3
categories:
  sport:
    url: https://yariga.net/
request_filter:
  whitelist:
  - '*.yariga.net/*'
  - '*.yariga.net/wp-content/*'
  - '*.gstatic.com/*.woff2'
  blacklist:
  - '*google-analytics.com/*'
  - '*googletagmanager.com/*'
  - '*doubleclick.net/*'
  - '*analytics.google.com/*'
  - '*stats.g.doubleclick.net/*'
  - '*facebook.com/*'
  - '*twitter.com/*'
  - '*addtoany.com/*'
  - '*cloudflareinsights.com/*'
  - '*/beacon.min.js/*'
  - '*/gtag/*'
  - '*/analytics/*'
  - '*?gtm=*'
  - '*/ccm/collect*'
  - '*/privacy-sandbox/*'
