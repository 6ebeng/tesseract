# Xendan Configuration
# Status: ✅ TESTED - WORKING
# Last Updated: 2025-10-24

name: 'Xendan'
base_url: 'https://www.xendan.org'
enabled: true
debug_urls: true  # Temporary: URL tracking for optimization

# ============================================================================
# URL FILTERING - Preset Based
# ============================================================================

url_filtering:
  preset: 'standard'
  whitelist: []
  blacklist: []

# ============================================================================
# ADVANCED FEATURES - All Enabled
# ============================================================================

# Rate Limiting: Prevent server overload and IP blocking
rate_limiting:
  enabled: true
  max_requests_per_minute: 30  # Polite scraping speed

# Redis Caching: Speed up re-runs by caching page HTML and articles
caching:
  enabled: true
  redis_host: 'localhost'
  redis_port: 6379
  ttl_hours: 24  # Cache for 24 hours

# Retry Logic: Handle network errors and timeouts
retry:
  enabled: true
  max_attempts: 3
  delay_seconds: 2

# Proxy Rotation: Bypass IP blocking (requires proxies.txt)
proxy:
  enabled: false  # Set to true when proxies.txt is available
  file: 'proxies.txt'
  strategy: 'round-robin'  # or 'random'


# Universal pagination
pagination:
  type: 'click_load_more'
  clicks: 5
  delay: 2
  load_more_button: 'a.nextbutton'  # Kurdish text: "دواتر" (next)

selectors:
  article_list: 'a:has(> .card-small)'
  article_title: ['div.detail-top > h1']
  article_body: ['div.detail-big-text-p > p']  # Merged

wait:
  selector: null
  timeout: 2

categories:
  political:
    url: 'https://www.xendan.org/babetakan?babet=1&title=%DA%A9%D9%88%D8%B1%D8%AF%D8%B3%D8%AA%D8%A7%D9%86'
  
  culture:
    url: 'https://www.xendan.org/babetakan?babet=8'
    pagination:
      clicks: 3
  
  sports:
    url: 'https://www.xendan.org/babetakan?babet=7'
    pagination:
      clicks: 3
